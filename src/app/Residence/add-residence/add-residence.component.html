<div class="container">
    <h2>{{ isUpdateMode ? 'Mise à jour de la résidence' : 'Ajouter une nouvelle résidence' }}</h2>
  
    <!-- Formulaire d'ajout ou de mise à jour -->
    <form (ngSubmit)="saveResidence()">
      <div class="form-group">
        <label for="name">Nom de la résidence</label>
        <input type="text" id="name" class="form-control" [(ngModel)]="residence.name" name="name" required>
      </div>
  
      <div class="form-group">
        <label for="address">Adresse</label>
        <input type="text" id="address" class="form-control" [(ngModel)]="residence.address" name="address" required>
      </div>
  
      <div class="form-group">
        <label for="image">URL de l'image</label>
        <input type="text" id="image" class="form-control" [(ngModel)]="residence.image" name="image" required>
      </div>
  
      <div class="form-group">
        <label for="status">Statut</label>
        <select id="status" class="form-control" [(ngModel)]="residence.status" name="status" required>
          <option value="Disponible">Disponible</option>
          <option value="Vendu">Vendu</option>
          <option value="En Construction">En Construction</option>
        </select>
      </div>
  
      <!-- Boutons pour soumettre ou annuler -->
      <button type="submit" class="btn btn-primary">
        {{ isUpdateMode ? 'Mettre à jour' : 'Ajouter' }}
      </button>
      <button type="button" class="btn btn-secondary" (click)="cancel()">Annuler</button>
    </form>
  </div>
