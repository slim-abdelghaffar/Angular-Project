<div class="add-apartment-container">
    <h2>Ajouter un Appartement</h2>
    
    <form (ngSubmit)="onSubmit()" #apartmentForm="ngForm">
      <div>
        <label for="apartNum">Numéro d'Appartement</label>
        <input type="number" id="apartNum" name="apartNum" [(ngModel)]="newApartment.apartNum" required />
      </div>
  
      <div>
        <label for="floorNum">Numéro d'Étage</label>
        <input type="number" id="floorNum" name="floorNum" [(ngModel)]="newApartment.floorNum" required />
      </div>
  
      <div>
        <label for="surface">Surface (m²)</label>
        <input type="number" id="surface" name="surface" [(ngModel)]="newApartment.surface" required />
      </div>
  
      <div>
        <label for="terrace">Terrasse</label>
        <input type="checkbox" id="terrace" name="terrace" [(ngModel)]="newApartment.terrace" />
      </div>
  
      <div>
        <label for="surfaceterrace">Surface Terrasse (m²)</label>
        <input type="number" id="surfaceterrace" name="surfaceterrace" [(ngModel)]="newApartment.surfaceterrace" />
      </div>
  
      <div>
        <label for="category">Catégorie</label>
        <input type="text" id="category" name="category" [(ngModel)]="newApartment.category" required />
      </div>
  
      <div>
        <label for="residenceId">ID de la Résidence</label>
        <input type="number" id="residenceId" name="residenceId" [(ngModel)]="newApartment.ResidenceId" required />
      </div>
  
      <button type="submit" [disabled]="!apartmentForm.form.valid">Créer Appartement</button>
    </form>
  </div>
