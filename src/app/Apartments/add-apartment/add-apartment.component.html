<form [formGroup]="apartForm" (ngSubmit)="addApartment()">
    <label for="apartNum">Apartment Number:</label>
    <input id="apartNum" formControlName="apartNum" type="text">
  
    <label for="floorNum">Floor Number:</label>
    <input id="floorNum" formControlName="floorNum" type="text">
  
    <label for="surface">Surface:</label>
    <input id="surface" formControlName="surface" type="text">
  
    <label for="terrace">Terrace:</label>
    <input id="terrace" formControlName="terrace" type="checkbox">
  
    <label for="surfaceterrace">Surface Terrace:</label>
    <input id="surfaceterrace" formControlName="surfaceterrace" type="text" [disabled]="!apartForm.get('terrace')?.value">
  
    <label for="category">Category:</label>
    <select id="category" formControlName="category">
      <option value="S+1">S+1</option>
      <option value="S+2">S+2</option>
      <option value="S+3">S+3</option>
    </select>
  
    <label for="ResidenceId">Residence:</label>
    <select id="ResidenceId" formControlName="ResidenceId">
      <!-- Ajouter ici les résidences disponibles -->
      <option value="1">Résidence 1</option>
      <option value="2">Résidence 2</option>
    </select>
  
    <button type="submit" [disabled]="!apartForm.valid">Add</button>
    <button type="reset">Reset</button>
  </form>
