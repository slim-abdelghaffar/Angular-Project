<div class="form-container">
  <h2 class="form-title">Ajouter un Appartement</h2>
  <form>
      <label for="apartment-number">Apartment Number:</label>
      <input type="text" id="apartment-number" name="apartment-number" required>

      <label for="floor-number">Floor Number:</label>
      <input type="text" id="floor-number" name="floor-number" required>

      <label for="surface">Surface:</label>
      <input type="text" id="surface" name="surface">

      <!-- Terrasse -->
      <label>Terrace:</label>
      <div class="radio-group">
          <input type="radio" id="terrace-yes" name="terrace" value="yes">
          <label for="terrace-yes">Yes</label>

          <input type="radio" id="terrace-no" name="terrace" value="no">
          <label for="terrace-no">No</label>
      </div>

      <label for="surface-terrace">Surface Terrace:</label>
      <input type="text" id="surface-terrace" name="surface-terrace">

      <!-- Catégorie S+1, S+2, S+3 -->
      <label>Category:</label>
      <div class="radio-group">
          <input type="radio" id="s1" name="category" value="S+1">
          <label for="s1">S+1</label>

          <input type="radio" id="s2" name="category" value="S+2">
          <label for="s2">S+2</label>

          <input type="radio" id="s3" name="category" value="S+3">
          <label for="s3">S+3</label>
      </div>

      <label for="residence">Residence:</label>
      <input type="text" id="residence" name="residence">

      <div class="button-container">
          <button type="submit">Add</button>
          <button type="reset" class="reset-btn">Reset</button>
      </div>
  </form>
</div>
