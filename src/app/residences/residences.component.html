<div>
  <h1>Residences</h1>

  <input type="text" [(ngModel)]="searchTerm" placeholder="Search by address" />

  <div *ngFor="let residence of filteredResidences">
    <h3>{{ residence.name }}</h3>
    <p>{{ residence.address }}</p>
    <img [src]="residence.image" alt="Residence image" width="150" height="100" />
    <button (click)="viewResidenceDetails(residence.id)">View Details</button>
    <button (click)="addToFavorites(residence)">Add to Favorites</button>
    <button (click)="deleteResidence(residence.id)">Delete</button>
  </div>

  <h3 *ngIf="favorites.length > 0">Favorites:</h3>
  <ul>
    <li *ngFor="let favorite of favorites">{{ favorite.name }}</li>
  </ul>
</div>
